{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}

{% block auth_content %}
<div class="auth-wrap">
    <div class="auth-card" style="text-align:center;">

        <div style="width:56px;height:56px;background:var(--lo-bg);border-radius:14px;
                    display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
            <i class="ti ti-circle-check" style="font-size:28px;color:var(--lo);"></i>
        </div>

        <h1 class="auth-heading">Password reset!</h1>
        <p class="auth-sub" style="margin-bottom:24px;">
            Your password has been set. You can now sign in with your new password.
        </p>

        <a href="{% url 'login' %}" class="btn btn-primary btn-block">
            <i class="ti ti-login"></i> Sign in
        </a>
    </div>
</div>
{% endblock auth_content %}
